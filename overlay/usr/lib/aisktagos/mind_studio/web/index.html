<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Studio</title>
<!-- Единый стиль Mind (MindKit design/): иконки .mi, 3D-кнопки, переливающийся градиент, bounce -->
<link rel="stylesheet" href="mind/mind-ui.css">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="mind/mind.svg" type="image/svg+xml">
<script src="mind/mind-ui.js" defer></script>
</head>
<body>
<div id="app" class="app">
  <!-- Боковая панель -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark mt-orb" aria-hidden="true"></div>
      <span class="brand-name mt-gradient-text">Mind Studio</span>
    </div>

    <nav class="nav">
      <button class="nav-item primary mt-bounce" id="btn-new" title="Ctrl+N">
        <i class="mi mi-plus" aria-hidden="true"></i>
        <span>Новый разговор</span><kbd>Ctrl N</kbd>
      </button>
      <button class="nav-item" data-view="history">
        <i class="mi mi-clock" aria-hidden="true"></i>
        <span>История</span>
      </button>
      <button class="nav-item" data-view="skills">
        <i class="mi mi-star" aria-hidden="true"></i>
        <span>Скиллы</span><span class="count" id="skills-count"></span>
      </button>
      <button class="nav-item" data-view="agents">
        <i class="mi mi-users" aria-hidden="true"></i>
        <span>Агенты</span>
      </button>
      <button class="nav-item" id="btn-settings">
        <i class="mi mi-settings" aria-hidden="true"></i>
        <span>Настройки</span>
      </button>
    </nav>

    <div class="side-scroll">
      <div class="side-section">
        <div class="side-title">Проекты</div>
        <div id="projects"></div>
      </div>
      <div class="side-section">
        <div class="side-title">Недавние</div>
        <div id="recent"></div>
      </div>
      <div class="side-section" id="agy-section">
        <div class="side-title">
          <span>Antigravity</span>
          <span class="dot" id="agy-dot" title=""></span>
        </div>
        <div id="agy-history"></div>
      </div>
    </div>

    <div class="side-foot">
      <button class="agent-health" id="health" title="Состояние агентов"></button>
    </div>
  </aside>

  <!-- Основная область -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="btn-toggle-side" title="Скрыть панель">
        <i class="mi mi-menu" aria-hidden="true"></i>
      </button>
      <div class="crumbs" id="crumbs"><span>Mind Studio</span></div>
      <div class="top-actions">
        <button class="icon-btn hidden" id="btn-handoff" title="Продолжить на другом устройстве (Handoff)">
          <i class="mi mi-devices" aria-hidden="true"></i>
        </button>
        <button class="icon-btn" id="btn-theme" title="Светлая / тёмная тема">
          <i class="mi mi-moon" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <section class="view" id="view-chat">
      <div class="scroll" id="scroll">
        <div class="column" id="feed"></div>
      </div>

      <div class="composer-wrap">
        <div class="column">
          <div class="chips" id="chips"></div>
          <div class="composer" id="composer">
            <textarea id="input" rows="1" placeholder="Спросите что угодно, / — скиллы, @ — агент"></textarea>
            <div class="composer-bar">
              <div class="left">
                <button class="pill icon" id="btn-attach" title="Вложить файл">
                  <i class="mi mi-attach" aria-hidden="true"></i>
                </button>
                <div class="picker" data-picker="agent"><button class="pill" id="pick-agent"></button></div>
                <div class="picker" data-picker="mode"><button class="pill" id="pick-mode"></button></div>
                <div class="picker" data-picker="skill"><button class="pill ghost" id="pick-skill">Скиллы</button></div>
              </div>
              <div class="right">
                <span class="hint" id="hint"></span>
                <button class="send" id="btn-send" title="Отправить (Enter)">
                  <i class="mi mi-white mi-send i-send" aria-hidden="true"></i>
                  <i class="mi mi-white mi-stop i-stop" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>
          <div class="foot-note" id="foot-note"></div>
        </div>
      </div>
    </section>

    <section class="view hidden" id="view-panel">
      <div class="scroll"><div class="column wide" id="panel"></div></div>
    </section>
  </main>
</div>

<!-- Всплывающее меню выбора -->
<div class="menu hidden" id="menu"></div>

<!-- Настройки -->
<div class="modal hidden" id="settings">
  <div class="modal-card">
    <aside class="modal-nav" id="settings-nav"></aside>
    <div class="modal-body">
      <div class="modal-head">
        <h2 id="settings-title">Настройки</h2>
        <button class="icon-btn" id="settings-close" title="Закрыть"><i class="mi mi-close" aria-hidden="true"></i></button>
      </div>
      <div class="modal-content" id="settings-content"></div>
    </div>
  </div>
</div>

<input type="file" id="file" multiple hidden>
<div class="toast hidden" id="toast"></div>
<script src="markdown.js"></script>
<script src="app.js"></script>
</body>
</html>
